name: ci

# Runs on every push and pull request, so a regression is caught before a tag
# is cut. release.yml handles tagging.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, build, validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The addon targets hosts on Node 20.19+ / 22.12+; both are covered.
        node-version: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Validate manifest and bundle
        run: npm run validate

  package:
    name: package artifact
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package
        run: npm run build && npm run package:no-bump

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: contribution-tracker-stats
          path: release/*.zip
          if-no-files-found: error

  self-check:
    name: verify release packaging
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package
        run: npm run build && node scripts/build-release.mjs --no-bump

      # Guards the packaging contract: root manifest, an addon.js entry, and no
      # dependencies or sourcemaps leaking into the archive.
      - name: Inspect archive contents
        run: |
          ls -la release/
          node -e "
            const AdmZip = require('adm-zip');
            const file = require('fs')
              .readdirSync('release')
              .find((name) => name.endsWith('.zip'));
            const entries = new AdmZip('release/' + file)
              .getEntries()
              .map((entry) => entry.entryName);
            console.log(entries.join('\n'));
            if (!entries.includes('manifest.json')) throw new Error('missing manifest.json');
            if (!entries.some((e) => e.endsWith('addon.js'))) throw new Error('missing addon.js');
            if (entries.some((e) => e.includes('node_modules'))) throw new Error('node_modules packaged');
            if (entries.some((e) => e.endsWith('.map'))) throw new Error('sourcemap in release');
            console.log('archive OK');
          "
