name: OpenCodeReview (auto-select free model)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  id-token: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_142ac20a-9008-4c72-8b96-fc80124c26da \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Verify OpenCode token
        run: |
          if [ -z "${OPENCODE_API_KEY:-}" ] || [ "${OPENCODE_API_KEY}" = "null" ]; then
            echo "::error::OpenCode sign-in failed: token is empty or null."
            exit 1
          fi
          echo "OpenCode sign-in OK (token masked)."

      - name: Pick free model with largest context
        id: pick
        env:
          OPENCODE_GO_API_KEY: ${{ env.OPENCODE_API_KEY }}
        run: |
          set -e
          tmp=$(mktemp)
          if ! curl -fsS \
               -H "Authorization: Bearer $OPENCODE_GO_API_KEY" \
               -H "x-opencode-session: ocr-auto-select" \
               https://opencode.ai/zen/go/v1/models -o "$tmp"; then
            echo "model=beam-free" >> $GITHUB_OUTPUT
            echo "::warning::Nie udalo sie pobrac listy modeli; uzywam beam-free"
            exit 0
          fi
          model=$(node -e '
            const fs = require("fs");
            let data;
            try { data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("beam-free"); process.exit(0); }
            const free = (data.data || []).filter(m =>
              m && m.id && !/nemotron/i.test(m.id) &&
              (m.cost?.text?.input?.price ?? 1) === 0
            );
            if (!free.length) { console.log("beam-free"); process.exit(0); }
            free.sort((a, b) =>
              (b.limit?.context ?? 0) - (a.limit?.context ?? 0) ||
              (b.created ?? 0) - (a.created ?? 0) ||
              String(a.id).localeCompare(String(b.id))
            );
            console.log(free[0].id);
          ' "$tmp")
          echo "model=${model:-beam-free}" >> $GITHUB_OUTPUT
          echo "Wybrano model: ${model:-beam-free}"

      - uses: alibaba/open-code-review@v1.13.3
        with:
          llm_url: "https://opencode.ai/zen/go/v1"
          llm_protocol: "openai"
          llm_model: ${{ steps.pick.outputs.model }}
          llm_auth_token: ${{ env.OPENCODE_API_KEY }}
          llm_extra_headers: "x-opencode-session=ocr-github-actions"
          language: "English"
          sticky_summary: "true"
          effort: "medium"

      - name: Show OCR error on failure
        if: failure()
        run: |
          echo "=== OCR stderr log ==="
          if [ -f /tmp/ocr-stderr.log ]; then cat /tmp/ocr-stderr.log; else echo "(brak pliku)"; fi
          echo "=== OCR result (head) ==="
          if [ -f /tmp/ocr-result.json ]; then head -c 2000 /tmp/ocr-result.json; else echo "(brak pliku)"; fi
