name: release

# The release version comes from the git tag, so nothing has to be mirrored by hand.
# This workflow performs no git writes: it resolves the version, verifies, packages
# and lets GitHub create the release (and the tag, on manual dispatch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when run manually
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # A tag push publishes exactly that version. A manual run increments the
      # version in the checkout and uses the result.
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            node scripts/version.mjs "${{ inputs.bump }}"
            version="$(node -p "require('./manifest.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Validate manifest and bundle
        run: npm run validate

      # `--version` writes the version into the staged manifest only, so the
      # checkout stays untouched and the archive always matches the tag.
      - name: Package release archive
        run: node scripts/build-release.mjs --version "${{ steps.version.outputs.version }}"

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: contribution-tracker-stats
          path: release/*.zip
          if-no-files-found: error

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/*.zip
          generate_release_notes: true
