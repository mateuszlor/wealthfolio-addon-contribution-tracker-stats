name: release

# The release version comes from the git tag, so nothing has to be mirrored by hand.
# This workflow performs no git writes: it resolves the version, verifies, packages
# and lets GitHub create the release (and the tag, on manual dispatch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when run manually
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # A tag push publishes exactly that version. A manual run increments the
      # version in the checkout and uses the result.
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            node scripts/version.mjs "${{ inputs.bump }}"
            version="$(node -p "require('./manifest.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Validate manifest and bundle
        run: npm run validate

      # `--version` writes the version into the staged manifest only, so the
      # checkout stays untouched and the archive always matches the tag.
      - name: Package release archive
        run: node scripts/build-release.mjs --version "${{ steps.version.outputs.version }}"

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: contribution-tracker-stats
          path: release/*.zip
          if-no-files-found: error

      # Refuses to touch a release that already ships an archive.
      #
      # The publish step reports success either way: a manual run can resolve to
      # a version that was released months ago, and the mismatch is only visible
      # afterwards, as a download that no longer matches its tag. This runs
      # first, so the run fails while nothing has been modified.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A missing release is the normal case, and gh prints a 404 body to
          # stdout with exit code 1, so `|| echo 0` alone would capture the JSON.
          # Anything that is not a bare number is treated as "no release".
          count="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets | length' 2>/dev/null || true)"
          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac
          if [ "$count" != "0" ]; then
            echo "::error::Release $TAG already has $count asset(s). Refusing to overwrite."
            echo "Either this version was already released, or the manual bump"
            echo "resolved to it by accident. Check manifest.json before re-running."
            exit 1
          fi
          echo "Release $TAG is empty; safe to publish."

      # `overwrite_files` is deliberately absent. With it, a manual run that
      # resolved to a version someone had already released silently deleted that
      # release's archive and replaced it with a build from an unrelated commit —
      # the `v1.0.2` "Privacy toggle" release shipped the wrong ZIP because
      # `manifest.json` still said 1.0.1 and the patch bump produced 1.0.2.
      # Failing here is the correct outcome: a released version's archive is part
      # of the record of what was released.
      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/*.zip
          generate_release_notes: true
