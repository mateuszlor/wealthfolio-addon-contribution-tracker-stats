name: release

# The git tag is the single source of truth for the version. This workflow never
# asks a human to mirror it into manifest.json: it derives the version from the
# tag (or auto-increments on manual dispatch), writes it, commits it, and packages.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when run manually
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            current="$(node -p "require('./manifest.json').version")"
            type="${{ inputs.bump }}"
            version="$(node "scripts/version.mjs" "$type" >/dev/null; node -p "require('./manifest.json').version")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Sync version into manifest
        run: node scripts/version.mjs set "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        run: |
          if git diff --quiet; then
            echo "Version already in sync."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json package.json
            git commit -m "chore: release ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name == '' && 'main' || github.ref_name }}
          fi

      - name: Tag manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Validate manifest and bundle
        run: npm run validate

      # `npm run package` bumps the working tree, so a tagged build passes the
      # version explicitly and leaves the repository untouched.
      - name: Package release archive
        run: node scripts/build-release.mjs --version "${{ steps.version.outputs.version }}"

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: contribution-tracker-stats
          path: release/*.zip
          if-no-files-found: error

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/*.zip
          generate_release_notes: true
